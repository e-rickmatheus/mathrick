<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .e-bar { fill: #111827; }
    .m-bar { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .e-bar { fill: #ffffff; }
      .m-bar { fill: #9ca3af; }
    }
  </style>
  <!-- Barra superior estendida (Header cobrindo a 1ª coluna) -->
  <rect class="e-bar" x="8" y="12" width="29" height="10" rx="1.5"/>
  <!-- Barra média do E -->
  <rect class="e-bar" x="8" y="27" width="19" height="10" rx="1.5"/>
  <!-- Barra inferior do E -->
  <rect class="e-bar" x="8" y="42" width="19" height="10" rx="1.5"/>
  
  <!-- Coluna 1 do M (Encaixada abaixo do header) -->
  <rect class="m-bar" x="30.5" y="27" width="6.5" height="25" rx="1.5"/>
  <!-- Coluna 2 do M (Altura total) -->
  <rect class="m-bar" x="40.5" y="12" width="6.5" height="40" rx="1.5"/>
  <!-- Coluna 3 do M (Altura total) -->
  <rect class="m-bar" x="50.5" y="12" width="6.5" height="40" rx="1.5"/>
</svg>
